name: Scan plugin updates

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check registry
        id: scan
        shell: bash
        run: |
          set +e
          npm run check:updates > update-report.txt 2>&1
          status=$?
          cat update-report.txt
          if [ "$status" -eq 2 ]; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
      - uses: actions/github-script@v7
        if: steps.scan.outputs.updates == 'true'
        with:
          script: |
            const fs = require('fs')
            const body = `Automated registry scan found updates:\n\n\`\`\`text\n${fs.readFileSync('update-report.txt', 'utf8')}\n\`\`\`\n\nRun the “Promote plugin release” workflow for each approved exact version.`
            const title = 'Plugin updates are available'
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'plugin-update' })
            const existing = data.find(issue => issue.title === title)
            if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body })
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['plugin-update'] })
